apiVersion: apps/v1
kind: Deployment

metadata:
  name: grafana
  namespace: geoinfra
  labels:
    app: grafana

spec:
  replicas: 1

  selector:
    matchLabels:
      app: grafana

  template:
    metadata:
      labels:
        app: grafana

    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"

            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"

            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"

          # ============================================================
          # Grafana provisioning
          # ============================================================

          volumeMounts:
            # Automatically provision Prometheus datasource.
            - name: grafana-datasource
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true

            # Tells Grafana where provisioned dashboards are stored.
            - name: grafana-dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true

            # Contains the GeoInfra dashboard JSON.
            - name: grafana-dashboard
              mountPath: /var/lib/grafana/dashboards
              readOnly: true

          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

      # ================================================================
      # Grafana provisioning ConfigMaps
      # ================================================================

      volumes:
        - name: grafana-datasource
          configMap:
            name: grafana-datasource

        - name: grafana-dashboard-provider
          configMap:
            name: grafana-dashboard-provider

        - name: grafana-dashboard
          configMap:
            name: grafana-dashboard
