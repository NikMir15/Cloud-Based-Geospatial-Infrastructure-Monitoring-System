apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: geoinfra
  labels:
    app: grafana
data:
  geoinfra-observability.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "type": "stat",
          "title": "GeoInfra Backend Status",
          "id": 1,
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "up{job=\"geo-backend\"}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN"
                    },
                    "1": {
                      "text": "UP"
                    }
                  }
                }
              ]
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Infrastructure Assets",
          "id": 2,
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "geoinfra_infrastructure_assets",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Total HTTP Requests",
          "id": 3,
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(geoinfra_http_requests_total)",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "HTTP Requests / Second",
          "id": 4,
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(geoinfra_http_requests_total[5m]))",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "HTTP Request Rate by Endpoint",
          "id": 5,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum by (path) (rate(geoinfra_http_requests_total[5m]))",
              "legendFormat": "{{path}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "HTTP Requests by Status Code",
          "id": 6,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum by (status_code) (rate(geoinfra_http_requests_total[5m]))",
              "legendFormat": "HTTP {{status_code}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Average Request Latency",
          "id": 7,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 13
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(geoinfra_http_request_duration_seconds_sum[5m])) / sum(rate(geoinfra_http_request_duration_seconds_count[5m]))",
              "legendFormat": "Average latency",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "P95 Request Latency",
          "id": 8,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 13
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(geoinfra_http_request_duration_seconds_bucket[5m])))",
              "legendFormat": "P95 latency",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        }
      ],
      "refresh": "15s",
      "schemaVersion": 39,
      "tags": [
        "geoinfra",
        "kubernetes",
        "prometheus",
        "observability"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "GeoInfra Kubernetes Observability",
      "uid": "geoinfra-k8s-observability",
      "version": 1
    }
