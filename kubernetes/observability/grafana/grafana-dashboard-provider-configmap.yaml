apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: geoinfra
  labels:
    app: grafana
data:
  dashboards.yaml: |
    apiVersion: 1

    providers:
      - name: GeoInfra
        orgId: 1
        folder: GeoInfra
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
